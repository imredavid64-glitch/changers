name: changers-appwrite

networks:
  appwrite:
    name: changers-appwrite

services:
  traefik:
    image: traefik:3.6
    container_name: changers-traefik
    command:
      - --providers.file.directory=/storage/config
      - --providers.file.watch=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.constraint-label-stack`,`appwrite`)
      - --entrypoints.appwrite_web.address=:80
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-config:/storage/config:ro
      - appwrite-certificates:/storage/certificates:ro
    depends_on:
      - appwrite
    networks:
      - appwrite

  mariadb:
    image: mariadb:10.11
    container_name: changers-mariadb
    restart: unless-stopped
    networks:
      - appwrite
    volumes:
      - appwrite-mariadb:/var/lib/mysql:rw
    environment:
      MYSQL_ROOT_PASSWORD: ${_APP_DB_ROOT_PASS}
      MYSQL_DATABASE: ${_APP_DB_SCHEMA}
      MYSQL_USER: ${_APP_DB_USER}
      MYSQL_PASSWORD: ${_APP_DB_PASS}
      MARIADB_AUTO_UPGRADE: "1"
    command: "mysqld --innodb-flush-method=fsync"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.7-alpine
    container_name: changers-redis
    restart: unless-stopped
    networks:
      - appwrite
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --maxmemory-samples 5
    volumes:
      - appwrite-redis:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  appwrite:
    image: appwrite/appwrite:1.9.5
    container_name: changers-appwrite
    restart: unless-stopped
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_api.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_api_http.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_api_http.rule=PathPrefix(`/`)
      - traefik.http.routers.appwrite_api_http.service=appwrite_api
    volumes:
      - appwrite-uploads:/storage/uploads:rw
      - appwrite-imports:/storage/imports:rw
      - appwrite-cache:/storage/cache:rw
      - appwrite-config:/storage/config:rw
      - appwrite-certificates:/storage/certificates:rw
      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - appwrite-builds:/storage/builds:rw
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - _APP_ENV=development
      - _APP_EDITION=community
      - _APP_LOCALE=en
      - _APP_CONSOLE_SECRET=${_APP_CONSOLE_SECRET}
      - _APP_CONSOLE_WHITELIST_ROOT=enabled
      - _APP_SYSTEM_EMAIL_NAME=Changers
      - _APP_SYSTEM_EMAIL_ADDRESS=changemaker@changers.app
      - _APP_OPTIONS_ABUSE=disabled
      - _APP_OPTIONS_ROUTER_PROTECTION=disabled
      - _APP_OPTIONS_FORCE_HTTPS=disabled
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_DOMAIN=localhost:8080
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=${_APP_DB_SCHEMA}
      - _APP_DB_USER=${_APP_DB_USER}
      - _APP_DB_PASS=${_APP_DB_PASS}
      - _APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET:-dev-executor-secret}
      - _APP_USAGE_STATS=disabled
      - _APP_LOGGING_CONFIG=
      - _APP_POOL_ADAPTER=swoole
      - _APP_DOMAIN_TARGET_CNAME=
      - _APP_DOMAIN_TARGET_AAAA=
      - _APP_DOMAIN_TARGET_A=
      - _APP_DOMAIN_TARGET_CAA=
      - _APP_DOMAIN_SITES=
      - _APP_DOMAIN_FUNCTIONS=

  appwrite-console:
    image: appwrite/console:8.7.11
    container_name: changers-console
    restart: unless-stopped
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_console.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_console_http.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_console_http.rule=PathPrefix(`/console`)
      - traefik.http.routers.appwrite_console_http.service=appwrite_console

  appwrite-worker-audits:
    image: appwrite/appwrite:1.9.5
    container_name: changers-worker-audits
    entrypoint: worker-audits
    restart: unless-stopped
    networks:
      - appwrite
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - _APP_ENV=development
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=${_APP_DB_SCHEMA}
      - _APP_DB_USER=${_APP_DB_USER}
      - _APP_DB_PASS=${_APP_DB_PASS}
      - _APP_POOL_ADAPTER=swoole
      - _APP_LOGGING_CONFIG=
      - _APP_WORKERS_NUM=1
      - _APP_WORKER_MAX_COROUTINES=1

  appwrite-worker-databases:
    image: appwrite/appwrite:1.9.5
    container_name: changers-worker-databases
    entrypoint: worker-databases
    restart: unless-stopped
    networks:
      - appwrite
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - _APP_ENV=development
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_ADAPTER=mariadb
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=${_APP_DB_SCHEMA}
      - _APP_DB_USER=${_APP_DB_USER}
      - _APP_DB_PASS=${_APP_DB_PASS}
      - _APP_POOL_ADAPTER=swoole
      - _APP_LOGGING_CONFIG=
      - _APP_WORKERS_NUM=1
      - _APP_WORKER_MAX_COROUTINES=1
      - _APP_QUEUE_NAME=database_db_main

volumes:
  appwrite-mariadb:
  appwrite-redis:
  appwrite-uploads:
  appwrite-imports:
  appwrite-cache:
  appwrite-config:
  appwrite-certificates:
  appwrite-functions:
  appwrite-sites:
  appwrite-builds:
