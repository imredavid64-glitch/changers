apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: changers-minio
  namespace: storage
spec:
  image: minio/minio:RELEASE.2024-09-01T04-28-33Z
  imagePullPolicy: IfNotPresent
  replicas: 4
  volumesPerServer: 4
  size: 50Gi
  storageClass: local-nvme
  requestAutoCert: true
  certConfig:
    commonName: minio.changers.internal
    dnsNames:
      - minio.changers.internal
      - minio.storage.svc.cluster.local
  configuration:
    name: changers-minio-config
  buckets:
    - name: uploads
      policy: none
      lifecycle:
        rule:
          - id: delete-incomplete-multipart
            status: Enabled
            abortIncompleteMultipartUpload:
              daysAfterInitiation: 7
    - name: avatars
      policy: public
    - name: backups
      policy: none
      lifecycle:
        rule:
          - id: expire-old-backups
            status: Enabled
            expiration:
              days: 90
  resources:
    requests:
      memory: 2Gi
      cpu: 1
    limits:
      memory: 4Gi
      cpu: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: minio
            topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: storage
type: Opaque
stringData:
  accessKeyId: "changers-access-key-change-me"
  secretAccessKey: "changers-secret-key-change-me-generate-secure"